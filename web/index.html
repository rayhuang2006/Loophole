<!doctype html>
<meta charset="utf-8">
<title>Loophole — 學會鑽精靈的漏洞</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ------------------------------------------------------------------
     The look is a printed technical standard that happens to be about a
     genie -- because that is exactly what this project is. The whitepaper
     imitates the ISO C++ style; the site should carry the same joke.

     So: a serif for prose and a monospace for machinery, and the contrast
     between them IS the thesis -- the fairy tale on one side, the machine on
     the other. Hairline rules instead of cards and shadows, the way a book
     divides a page. Rubrication: in a manuscript the scribe wrote the body in
     iron-gall black and marked what mattered in vermilion, and here the same
     red marks exactly one thing -- the place where the genie was beaten.
     ------------------------------------------------------------------ */
  :root {
    --paper:  #f4efe4;   /* laid paper */
    --sheet:  #fbf8f1;   /* the leaf you write on */
    --sunk:   #e9e2d3;
    --ink:    #1a1712;   /* iron gall */
    --ink-2:  #6a6255;
    --ink-3:  #9c9384;
    --rule:   #cdc3ae;
    --rubric: #9c2b18;   /* vermilion: the exploit, and nothing else */
    --seal:   #1f4c3f;   /* holds, passed, safe */
    --gold:   #8a6a25;
    --lapis:  #245070;
    --plum:   #5d3a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #14120e;
      --sheet:  #1a1713;
      --sunk:   #221e18;
      --ink:    #ece5d6;
      --ink-2:  #a49b8a;
      --ink-3:  #7a7264;
      --rule:   #35301f;
      --rubric: #e07a63;
      --seal:   #86c4a6;
      --gold:   #d0a45e;
      --lapis:  #86b8d6;
      --plum:   #bfa0d0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.72 "Iowan Old Style", "Palatino Linotype", Palatino,
          "Songti TC", "Source Han Serif TC", "Noto Serif CJK TC", Georgia, serif;
  }
  .wrap { max-width: 1460px; margin: 0 auto; padding: 0 28px; }

  /* ---- masthead: a title page ------------------------------------- */
  header { border-bottom: 2px solid var(--ink); }
  header .wrap { padding-top: 30px; padding-bottom: 14px; }
  .brow {
    font: 500 11px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 12px;
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 400; letter-spacing: -.01em;
  }
  h1 span { color: var(--ink-2); }
  .sub {
    margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 68ch;
  }
  .sub b { color: var(--ink); font-weight: 600; }

  /* ---- contents rail ----------------------------------------------
     One hairline of ticks, one per chapter. Twenty-eight numbered chapters
     laid out in full took two rows and shouted louder than the chapter being
     read; dropping the whole table down on hover was barely better, since it
     put the same two rows back. Instead the readout on the left names whichever
     tick the pointer is over, so the contents are reachable a chapter at a
     time and never occupy the page. */
  #rail {
    border-bottom: 1px solid var(--rule); background: var(--sheet);
    outline: 0;
  }
  #rail .wrap { padding-top: 0; padding-bottom: 0; }
  .railbar { display: flex; align-items: center; gap: 16px; height: 34px; }
  /* Fixed width: the text changes as the pointer moves along the ticks, and a
     readout that resizes would drag the ticks about under the cursor. */
  .railnow {
    flex: 0 0 auto; width: 25ch; overflow: hidden; text-overflow: ellipsis;
    font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    color: var(--ink-2); white-space: nowrap;
  }
  .railnow.peek { color: var(--ink); }
  @media (max-width: 720px) { .railnow { width: 17ch; } }
  .ticks { flex: 1; display: flex; gap: 2px; align-items: center; min-width: 0; }
  .tick {
    flex: 1; height: 3px; background: var(--rule); border: 0; padding: 0;
    cursor: pointer; transition: height .12s, background .12s;
  }
  .tick.solved { background: var(--seal); }
  .tick:hover, .tick:focus-visible {
    height: 9px; background: var(--ink-2); outline: 0;
  }
  .tick.on { height: 9px; background: var(--ink); }
  .tick.on.solved { background: var(--seal); }
  .tick.gap { flex: 0 0 9px; background: none; cursor: default; }


  /* ---- layout ------------------------------------------------------ */
  main { display: block; }
  main .wrap {
    padding-top: 26px; padding-bottom: 60px;
    display: grid; gap: 0; align-items: start;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 1080px) {
    main .wrap {
      grid-template-columns: minmax(360px, 46ch) minmax(0, 1fr);
      gap: 0 40px;
    }
    #teach {
      position: sticky; top: 22px; max-height: calc(100vh - 44px);
      overflow-y: auto; padding-right: 34px; border-right: 1px solid var(--rule);
      scrollbar-width: thin;
    }
  }

  /* ---- the chapter ------------------------------------------------- */
  .crumb {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
    font: 500 11px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .14em; color: var(--ink-3);
  }
  .crumb .grow { flex: 1; }
  .crumb button {
    border: 0; background: none; color: var(--ink-3); cursor: pointer;
    font: 15px/1 ui-monospace, Menlo, monospace; padding: 2px 5px;
  }
  .crumb button:hover:not(:disabled) { color: var(--ink); }
  .crumb button:disabled { color: var(--rule); cursor: default; }

  #lesson-title {
    margin: 0 0 4px; font-size: 25px; font-weight: 400; line-height: 1.28;
    letter-spacing: -.012em;
  }
  #lesson-title .num {
    font: 400 25px/1 ui-monospace, Menlo, monospace; color: var(--ink-3);
    margin-right: 10px;
  }
  .rule-under { border: 0; border-top: 1px solid var(--rule); margin: 14px 0 16px; }

  #lesson-brief p { margin: 0 0 13px; }
  #lesson-brief p:last-child { margin-bottom: 0; }
  #lesson-brief b, #donebox b { font-weight: 600; }
  #lesson-brief ol { margin: 0 0 13px; padding-left: 1.3em; }
  #lesson-brief li { margin-bottom: 5px; }

  /* A sentence that carries the point of the chapter. Larger, and set off. */
  .lead {
    font-size: 18.5px; line-height: 1.5; margin: 16px 0 !important;
    padding-left: 15px; border-left: 2px solid var(--rubric);
  }
  /* Something the genie or the engineer says out loud. */
  .say {
    font-size: 17px; font-style: italic; color: var(--ink-2);
    margin: 15px 0 15px 18px !important;
  }

  #lesson-brief code, .goal code, #hint code, #donebox code, .say code {
    font: 13.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-style: normal;
    background: var(--sunk); padding: 1px 5px; border-radius: 2px;
  }
  #lesson-brief pre, #donebox pre {
    margin: 12px 0; padding: 12px 14px; background: var(--sunk);
    border-left: 2px solid var(--rule); overflow-x: auto;
    font: 13px/1.68 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* An annotated line of syntax, then what each piece is called. */
  .anno {
    margin: 13px 0 4px; padding: 11px 14px;
    background: var(--sunk); border-left: 2px solid var(--rule);
    font: 14.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .anno b { color: var(--plum);  font-weight: 600; }
  .anno i { color: var(--lapis); font-style: normal; }
  .anno u { color: var(--seal);  text-decoration: none; }
  .anno s { color: var(--rubric); text-decoration: none; }
  .key {
    margin: 0 0 14px !important; font-size: 14px; color: var(--ink-2);
    line-height: 1.9;
  }
  .key b { color: var(--plum); } .key i { color: var(--lapis); font-style: normal; }
  .key u { color: var(--seal); text-decoration: none; }
  .key s { color: var(--rubric); text-decoration: none; }

  /* Two things set against each other -- the shape most of this course is in. */
  .two {
    display: grid; gap: 0; margin: 14px 0 !important;
    border-top: 1px solid var(--rule);
  }
  .two > div {
    padding: 10px 0 10px 2px; border-bottom: 1px solid var(--rule);
    font-size: 14.5px; line-height: 1.66;
  }
  .tag {
    display: block; font: 500 11px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .1em; color: var(--ink-3); margin-bottom: 4px;
  }
  /* A counter or a dial rolling over. */
  .dial {
    margin: 13px 0 !important; padding: 10px 0; text-align: center;
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-2); border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule); letter-spacing: .04em;
  }
  .dial b { color: var(--rubric); font-weight: 600; }

  .goal {
    margin: 18px 0 0 !important; padding: 12px 0 0;
    border-top: 2px solid var(--ink); font-size: 15px;
  }
  .goal .lbl {
    font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); margin-right: 9px;
  }
  .hintrow { margin: 11px 0 0 !important; font-size: 14px; }
  .hintrow button {
    font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 5px 10px; border: 1px solid var(--rule); background: none;
    color: var(--ink-3); cursor: pointer;
  }
  .hintrow button:hover { color: var(--ink); border-color: var(--ink-2); }
  #hint { color: var(--ink-2); }

  /* The seal at the foot of the chapter. */
  #donebox {
    margin: 20px 0 0; padding: 14px 0 0; border-top: 2px solid var(--seal);
    font-size: 15px;
  }
  #donebox .head {
    font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em;
    text-transform: uppercase; color: var(--seal); margin-bottom: 10px;
  }
  #donebox p { margin: 0 0 11px; } #donebox p:last-child { margin-bottom: 0; }
  /* The last chapter is the only place with links in the text, and it needs
     them: a course that ends with no way out of itself has wasted the reader
     it just finished convincing. */
  #donebox a, #lesson-brief a {
    color: var(--ink); text-decoration: underline;
    text-decoration-color: var(--rule); text-underline-offset: 3px;
  }
  #donebox a:hover, #lesson-brief a:hover { text-decoration-color: var(--seal); }
  .onward { margin-top: 15px; }
  .onward button {
    font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 9px 18px; border: 1px solid var(--seal); background: var(--seal);
    color: var(--paper); cursor: pointer;
  }
  .onward button:hover { filter: brightness(1.12); }
  #donebox .lead { border-left-color: var(--seal); }
  .readon {
    margin: 20px 0 0; padding-top: 14px; border-top: 2px solid var(--ink);
  }
  .readon button {
    font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 9px 18px; border: 1px solid var(--ink); background: var(--ink);
    color: var(--paper); cursor: pointer;
  }
  .readon button:hover { background: var(--rubric); border-color: var(--rubric); }

  /* ---- the workspace ---------------------------------------------- */
  #work { display: grid; gap: 22px; grid-template-columns: minmax(0,1fr); }
  @media (min-width: 1080px) { #work { padding-left: 2px; } }
  /* Stacked, the report comes before the genie. After pressing Run the reader
     is looking for the verdict, and the built-in genie is fifty lines of
     reference material that pushed it off the bottom of the screen. Side by
     side there is no conflict, so the order goes back to source-order. */
  #pane-report { order: 2; }
  #pane-genie  { order: 3; }

  @media (min-width: 1560px) {
    #work { grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 22px; }
    #work > .full { grid-column: 1 / -1; }
    #pane-genie { order: 2; } #pane-report { order: 3; }
  }
  #work.reading { opacity: .42; filter: saturate(.25); transition: opacity .2s; }

  .panehead {
    display: flex; align-items: center; gap: 10px;
    padding: 0 0 7px; border-bottom: 1px solid var(--ink);
  }
  .panehead h2 {
    margin: 0; font: 500 11px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2);
  }
  .panehead .grow { flex: 1; }
  .btn {
    font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    padding: 7px 14px; border: 1px solid var(--ink-2); background: none;
    color: var(--ink); cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--sunk); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.primary:hover:not(:disabled) { background: var(--rubric); border-color: var(--rubric); }
  .btn:disabled { opacity: .35; cursor: default; }
  kbd {
    font: 11px ui-monospace, Menlo, monospace; color: var(--ink-3);
    letter-spacing: .06em;
  }

  /* ---- the editor -------------------------------------------------
     A transparent textarea sitting exactly on a highlighted <pre>: native
     editing, selection and IME intact, no editor dependency, and the page
     stays three files somebody can read straight through. */
  .ed { position: relative; background: var(--sheet); }
  .ed pre, .ed textarea {
    margin: 0; padding: 14px 16px; border: 0; width: 100%;
    font: 13.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    tab-size: 4; white-space: pre; overflow-wrap: normal;
  }
  /* Height follows the text. A six-line chapter used to sit in a 244px box and
     push the report off the bottom of the screen -- a reader had to scroll from
     the top of the page to the bottom to find out what happened. */
  .ed pre { overflow: auto; pointer-events: none; }
  .ed textarea {
    position: absolute; inset: 0; resize: none; overflow: auto;
    background: transparent; color: transparent; caret-color: var(--rubric);
    -webkit-text-fill-color: transparent;
  }
  .ed textarea::selection { background: color-mix(in srgb, var(--gold) 30%, transparent); }
  .ed textarea:focus { outline: 0; }
  .ed.focus { box-shadow: inset 0 0 0 1px var(--ink-2); }

  .t-kw   { color: var(--plum); font-weight: 600; }
  .t-op   { color: var(--ink-3); }
  .t-num  { color: var(--seal); }
  .t-str  { color: var(--rubric); }
  .t-com  { color: var(--ink-3); font-style: italic; }
  .t-type { color: var(--lapis); }

  /* ---- the report -------------------------------------------------- */
  #out {
    margin: 0; padding: 15px 17px; min-height: 200px; max-height: 60vh;
    overflow: auto; white-space: pre; background: var(--sheet);
    font: 13px/1.62 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #out.waiting { color: var(--ink-3); font-style: italic; }
  .chip {
    font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 4px 9px; border: 1px solid currentColor;
  }
  .c0 { color: var(--seal); } .c1 { color: var(--rubric); } .c2 { color: var(--gold); }
  .a-red { color: var(--rubric); font-weight: 600; }
  .a-green { color: var(--seal); font-weight: 600; }
  .a-cyan { color: var(--lapis); }
  .a-bold { font-weight: 600; }

  footer { border-top: 1px solid var(--rule); }
  footer .wrap {
    padding-top: 15px; padding-bottom: 40px;
    font: 11px/1.8 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    color: var(--ink-3);
  }
  footer a { color: var(--ink-2); }
  a { color: var(--rubric); }
</style>

<header>
  <div class="wrap">
    <div class="brow">Loophole · 二十八章 · 全部跑在你的瀏覽器裡</div>
    <h1>把精靈的漏洞<span>編譯出來</span></h1>
    <p class="sub">
      一個工程師笑話，被當成一份技術規格認真對待。
      你會親手寫出六種精靈擋不住的招式——<b>而且不是我說你成功了，是編譯器說的。</b>
    </p>
  </div>
</header>

<div id="rail" tabindex="0">
  <div class="wrap">
    <div class="railbar">
      <span class="railnow"></span>
      <div class="ticks" id="ticks"></div>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
  <section id="teach">
    <div class="crumb">
      <span id="lesson-act"></span>
      <span class="grow"></span>
      <button id="prev" title="上一章">←</button>
      <button id="next" title="下一章">→</button>
    </div>
    <h1 id="lesson-title"></h1>
    <hr class="rule-under">
    <div id="lesson-brief"></div>
    <p class="goal"><span class="lbl">目標</span> <span id="lesson-goal"></span></p>
    <p class="hintrow"><button id="hintbtn">看提示</button> <span id="hint" hidden></span></p>
    <div class="readon" id="readon" hidden><button id="readnext">讀完了，下一章 →</button></div>
    <div id="donebox" hidden></div>
  </section>

  <div id="work">
    <section class="pane">
      <div class="panehead">
        <h2>wish — 你的願望</h2>
        <span class="grow"></span>
        <kbd id="kbd"></kbd>
        <button class="btn primary" id="run">Run</button>
        <button class="btn" id="hunt" title="窮舉界限內每一支願望程式">Hunt</button>
        <button class="btn" id="cancel" hidden>取消</button>
      </div>
      <div class="ed" id="ed-wish">
        <pre aria-hidden="true"><code id="hl-wish"></code></pre>
        <textarea id="wish" spellcheck="false" autocapitalize="off"
                  autocorrect="off" aria-label="wish source"></textarea>
      </div>
    </section>

    <section class="pane" id="pane-genie">
      <div class="panehead">
        <h2>genie — 精靈的規矩</h2>
        <span class="grow"></span>
        <button class="btn" id="reset">還原這一關</button>
      </div>
      <div class="ed tall" id="ed-genie">
        <pre aria-hidden="true"><code id="hl-genie"></code></pre>
        <textarea id="genie" spellcheck="false" autocapitalize="off"
                  autocorrect="off" aria-label="genie policy"></textarea>
      </div>
    </section>

    <section class="pane full" id="pane-report">
      <div class="panehead">
        <h2>report — 判決</h2>
        <span class="grow"></span>
        <span id="verdict"></span>
      </div>
      <pre id="out" class="waiting">載入編譯器…</pre>
    </section>
  </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span id="ver"></span> ·
    <a href="https://github.com/rayhuang2006/Loophole">原始碼</a> ·
    <a href="https://github.com/rayhuang2006/Loophole/blob/main/docs/spec/loophole-1.0.md">語言規格</a>
  </div>
</footer>

<script src="./lessons.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const out = $('out'), verdict = $('verdict');
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // ---- syntax highlighting ------------------------------------------
  //
  // There is no keyword list here. The compiler emits one — `--keywords`, built
  // from the same tables the lexer and the parser read — and the worker hands it
  // over when it starts. A copy kept on this side would go stale the first time
  // the language grew and the only symptom would be a word quietly losing its
  // colour.
  let KW = null;
  function setKeywords(json) {
    const d = JSON.parse(json);
    const all = [].concat(d.wish, d.genie, d.operations, d.layers, d.expressions);
    // Longest first: `in` must not win over `invariant`.
    all.sort((a, b) => b.length - a.length);
    KW = new RegExp('^(' + all.join('|') + ')$');
  }

  function highlight(src) {
    let o = '', i = 0, m;
    const re = /(#[^\n]*)|("(?:[^"\\]|\\.)*")|(\buint\s*<\s*\d+\s*>)|(\b\d+\b)|([A-Za-z_一-鿿][\w一-鿿]*)|(:=|->|==|!=|<=|>=|[<>=+\-,.:(){}])/g;
    while ((m = re.exec(src)) !== null) {
      if (m.index > i) o += esc(src.slice(i, m.index));
      const t = m[0];
      if (m[1])      o += `<span class="t-com">${esc(t)}</span>`;
      else if (m[2]) o += `<span class="t-str">${esc(t)}</span>`;
      else if (m[3]) o += `<span class="t-type">${esc(t)}</span>`;
      else if (m[4]) o += `<span class="t-num">${esc(t)}</span>`;
      else if (m[5]) o += (KW && KW.test(t)) ? `<span class="t-kw">${esc(t)}</span>` : esc(t);
      else           o += `<span class="t-op">${esc(t)}</span>`;
      i = m.index + t.length;
    }
    o += esc(src.slice(i));
    // The trailing newline has to survive, or the highlighted layer ends a line
    // short of the textarea and the last line loses its colour.
    return o + '\n';
  }

  function wire(edId, taId, hlId) {
    const ed = $(edId), ta = $(taId), hl = $(hlId);
    // Six lines minimum so an empty chapter still looks like somewhere to
    // write, twenty-two maximum so a long genie cannot take over the page.
    const LH = 21.84, PAD = 30, MIN = 6, MAX = 22;
    const paint = () => {
      hl.innerHTML = highlight(ta.value);
      const n = Math.min(MAX, Math.max(MIN, ta.value.split('\n').length));
      hl.parentElement.style.height = (n * LH + PAD) + 'px';
    };
    const sync = () => {
      hl.parentElement.scrollTop = ta.scrollTop;
      hl.parentElement.scrollLeft = ta.scrollLeft;
    };
    ta.addEventListener('input', () => { paint(); sync(); });
    ta.addEventListener('scroll', sync);
    ta.addEventListener('focus', () => ed.classList.add('focus'));
    ta.addEventListener('blur', () => ed.classList.remove('focus'));
    // Tab inserts spaces. Losing focus to the next control mid-line is worse
    // than losing the tab key, in an editor with no other way to indent.
    ta.addEventListener('keydown', e => {
      if (e.key !== 'Tab' || e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      const s = ta.selectionStart, t = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(t);
      ta.selectionStart = ta.selectionEnd = s + 4;
      paint();
    });
    return paint;
  }
  const paintWish = wire('ed-wish', 'wish', 'hl-wish');
  const paintGenie = wire('ed-genie', 'genie', 'hl-genie');

  // ---- report rendering ---------------------------------------------
  // Only the four sequences the compiler emits. Not a terminal.
  const ANSI = { '1;31': 'a-red', '1;36': 'a-cyan', '1;32': 'a-green', '1': 'a-bold' };
  function render(text) {
    let html = '', open = 0, i = 0, m;
    const re = /\x1b\[([0-9;]*)m/g;
    while ((m = re.exec(text)) !== null) {
      html += esc(text.slice(i, m.index));
      if (m[1] === '0' || m[1] === '') { while (open-- > 0) html += '</span>'; open = 0; }
      else if (ANSI[m[1]]) { html += `<span class="${ANSI[m[1]]}">`; open++; }
      i = m.index + m[0].length;
    }
    html += esc(text.slice(i));
    while (open-- > 0) html += '</span>';
    return html;
  }

  // Lesson text: blank lines separate paragraphs, `**x**` marks a term. Every
  // other tag is written as HTML, because this text is content the repo owns.
  function para(text) {
    return text.trim().split(/\n\s*\n/).map(t => {
      const b = t.trim().replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      return /^<(pre|div)/.test(b) ? b : '<p>' + b + '</p>';
    }).join('');
  }

  // ---- the compiler, in a worker ------------------------------------
  let worker = null, pending = 0, timer = null, booted = false, builtinGenie = '';

  function spawn() {
    // Never cached: it is a kilobyte, and a stale worker paired with a newer
    // page reads as a logic error rather than a caching one -- the page asks
    // for a field the old worker does not send, so every lesson silently
    // reports "not solved". The 370 KB module it loads is a different URL and
    // stays cached normally.
    worker = new Worker('./worker.js?v=' + Date.now());
    worker.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') {
        const [c, w, g] = d.versions.split('|');
        $('ver').textContent = `loophole ${c} · wish ${w} · genie ${g}`;
        if (!booted) {
          builtinGenie = d.genie;
          try { setKeywords(d.keywords); } catch (_) { /* colour, not correctness */ }
          booted = true; load(0);
        }
        return;
      }
      if (d.id !== pending) return;      // stale reply from before a cancel
      finish(d);
    };
    worker.onerror = () => {
      out.className = '';
      out.textContent = '編譯器載不起來。這個頁面需要 WebAssembly 和 Web Worker。';
    };
  }
  spawn();

  function busy(on, what) {
    $('run').disabled = $('hunt').disabled = on;
    $('cancel').hidden = !on;
    if (timer) { clearInterval(timer); timer = null; }
    if (!on) return;
    out.className = 'waiting';
    const t0 = Date.now();
    out.textContent = what + '…';
    timer = setInterval(() => {
      out.textContent = what + '… ' + ((Date.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);
  }

  function finish(d) {
    busy(false);
    out.className = '';
    if (d.error) { out.textContent = '編譯器爆炸了（這是 bug，請回報）：' + d.error; return; }
    out.innerHTML = render(d.output) || '(沒有輸出)';
    const label = { 0: '沒有 exploit', 1: '有 exploit', 2: '讀不懂' }[d.code];
    verdict.innerHTML = `<span class="chip c${d.code}">exit ${d.code} · ${label}</span>`;
    mark(d);
  }

  // ---- lessons -------------------------------------------------------
  // The key carries a version because progress is stored by chapter id, and
  // the ids survive a rewrite of the course. Reusing the key across the last
  // rewrite marked six chapters done that the reader had never seen: the old
  // 21-lesson set shared ids with this one. Bump it whenever chapters change.
  const KEY = 'loophole.solved.v3';
  let solved = new Set();
  try { solved = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...solved])); } catch (_) {} };

  let at = 0;
  const L = () => LESSONS[at];

  function drawRail() {
    const acts = [...new Set(LESSONS.map(l => l.act))];
    const ticks = $('ticks');
    ticks.textContent = '';
    let n = 0;
    acts.forEach((act, ai) => {
      if (ai) { const g = document.createElement('span'); g.className = 'tick gap'; ticks.appendChild(g); }
      for (const l of LESSONS.filter(x => x.act === act)) {
        const i = n++;
        const t = document.createElement('button');
        t.className = 'tick' + (i === at ? ' on' : '') + (solved.has(l.id) ? ' solved' : '');
        t.setAttribute('aria-label', (i + 1) + '. ' + l.title);
        // The readout says which chapter is under the pointer, so the whole
        // table of contents never has to be on screen. Two rows of numbered
        // chapters shouted louder than the chapter being read.
        t.onmouseenter = () => say(i, true);
        t.onfocus = () => say(i, true);
        t.onclick = e => { e.stopPropagation(); load(i); };
        ticks.appendChild(t);
      }
    });
    ticks.onmouseleave = () => say(at, false);
    say(at, false);
  }

  function say(i, peek) {
    const l = LESSONS[i], el = document.querySelector('.railnow');
    el.classList.toggle('peek', peek);
    el.textContent = peek
      ? String(i + 1).padStart(2, '0') + ' · ' + l.act + ' · ' + l.title
      : l.act + ' · ' + String(i + 1).padStart(2, '0') + ' / ' + LESSONS.length;
    el.title = peek ? l.title : '';
  }

  function load(i) {
    at = Math.max(0, Math.min(LESSONS.length - 1, i));
    const l = L();
    $('lesson-act').textContent = l.act;
    $('lesson-title').innerHTML =
      '<span class="num">' + String(at + 1).padStart(2, '0') + '</span>' + esc(l.title);
    $('lesson-brief').innerHTML = para(l.brief);

    // A reading chapter has no goal and nothing to type. Dimming the workspace
    // rather than hiding it keeps the page from jumping about, and says plainly
    // that there is nothing over there to do yet.
    const reading = !!l.read;
    $('lesson-goal').parentElement.hidden = reading;
    // Only before it has been read. Afterwards the seal below carries the way
    // onward, and two buttons a few centimetres apart saying the same thing is
    // worse than either alone.
    $('readon').hidden = !reading || solved.has(l.id);
    $('work').classList.toggle('reading', reading);
    if (!reading) $('lesson-goal').innerHTML = l.goal;
    // A reading chapter keeps whatever is in the editors unless it brings its
    // own illustration. Blanking them would read as broken rather than as
    // "nothing to do here" -- the dimming already says that.
    if (l.wish !== undefined) {
      $('wish').value = l.wish;
      $('genie').value = (l.genie === null || l.genie === undefined) ? builtinGenie : l.genie;
      paintWish(); paintGenie();
    }
    $('hintbtn').parentElement.hidden = reading || !l.hint;
    $('hint').hidden = true;
    $('hint').innerHTML = l.hint || '';
    $('hintbtn').textContent = '看提示';

    $('prev').disabled = at === 0;
    $('next').disabled = at === LESSONS.length - 1;
    showDone(solved.has(l.id));
    out.className = 'waiting';
    out.textContent = reading ? '這一章沒有東西要跑。'
                              : (l.huntOnly ? '按 Hunt。' : '按 Run。');
    verdict.textContent = '';
    drawRail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showDone(on) {
    const box = $('donebox');
    box.hidden = !on;
    if (!on) return;
    box.innerHTML = '<div class="head">✓ 過關</div>' + para(L().done);
    // The way out. Without it the only way forward was a small arrow at the
    // top of the panel, which is nowhere near where the reader is looking when
    // they have just succeeded.
    if (at < LESSONS.length - 1) {
      const p = document.createElement('p'); p.className = 'onward';
      const b = document.createElement('button');
      b.textContent = '下一章：' + LESSONS[at + 1].title + ' →';
      b.onclick = () => load(at + 1);
      p.appendChild(b); box.appendChild(p);
    }
  }

  // The compiler is the marker. Nothing here looks at what you typed: it asks
  // the genie whether you got away with it, which is the only question this
  // language has ever been about.
  function mark(d) {
    const l = L();
    let ok = false;
    if (l.huntOnly) ok = true;
    else if (d.json) { try { ok = l.pass(JSON.parse(d.json)); } catch (_) {} }
    if (ok && !solved.has(l.id)) { solved.add(l.id); save(); drawRail(); }
    showDone(ok || solved.has(l.id));
  }

  function go(hunt) {
    if (!booted) return;
    verdict.textContent = '';
    busy(true, hunt ? '搜尋界限內每一支程式' : '判決中');
    worker.postMessage({ id: ++pending, wish: $('wish').value,
                         genie: $('genie').value, hunt,
                         maxStmts: 2, maxWishes: 4 });
  }

  $('run').onclick = () => go(false);
  $('hunt').onclick = () => go(true);
  $('prev').onclick = () => load(at - 1);
  $('next').onclick = () => load(at + 1);
  $('reset').onclick = () => load(at);
  $('readnext').onclick = () => {
    const l = L();
    if (!solved.has(l.id)) { solved.add(l.id); save(); }
    if (at < LESSONS.length - 1) load(at + 1);
    else { $('readon').hidden = true; drawRail(); showDone(true); }
  };
  $('hintbtn').onclick = () => {
    const h = $('hint');
    h.hidden = !h.hidden;
    $('hintbtn').textContent = h.hidden ? '看提示' : '收起提示';
  };
  $('cancel').onclick = () => {
    // A search cannot be asked to stop politely -- it is one long call inside
    // wasm with no yield point. Killing the worker is the only way out.
    worker.terminate(); pending++; spawn(); busy(false);
    out.className = 'waiting'; out.textContent = '已取消。';
    verdict.textContent = '';
  };

  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  $('kbd').textContent = (mac ? '⌘' : 'Ctrl') + '↩';
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); go(L().huntOnly); }
  });
})();
</script>
