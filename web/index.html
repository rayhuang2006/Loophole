<!doctype html>
<meta charset="utf-8">
<title>Loophole — playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1c1b19; --dim: #6b675f; --line: #e0dcd3;
    --panel: #fff; --accent: #8a5a2b;
    --red: #b3261e; --green: #2e6b34; --cyan: #1f5f7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --fg: #e8e4da; --dim: #97928a; --line: #2f2d26;
      --panel: #1d1c16; --accent: #d3a05e;
      --red: #f2867c; --green: #8fd096; --cyan: #7fc4de;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, "Helvetica Neue", sans-serif;
  }
  header {
    padding: 22px 20px 14px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  header p { margin: 6px 0 0; color: var(--dim); max-width: 62ch; }
  main {
    display: grid; gap: 14px; padding: 16px 20px 40px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
  section { min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .bar h2 {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim);
  }
  .grow { flex: 1; }
  textarea, pre {
    width: 100%; margin: 0; padding: 12px 14px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    tab-size: 4;
  }
  textarea { min-height: 210px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  pre { min-height: 210px; overflow: auto; white-space: pre; }
  button, select {
    font: inherit; font-size: 13px; padding: 6px 12px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  button.run {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  .verdict {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; border: 1px solid currentColor;
  }
  .v0 { color: var(--green); }
  .v1 { color: var(--accent); }
  .v2 { color: var(--red); }
  .ansi-red { color: var(--red); font-weight: 600; }
  .ansi-green { color: var(--green); font-weight: 600; }
  .ansi-cyan { color: var(--cyan); }
  .ansi-bold { font-weight: 600; }
  nav#steps {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
  }
  nav#steps button {
    padding: 3px 9px; font-size: 12px; border-radius: 999px;
  }
  nav#steps button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav#steps button.solved { border-color: var(--green); color: var(--green); }
  nav#steps button.on.solved { background: var(--green); color: #fff; }
  article {
    padding: 14px 16px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  article h3 { margin: 0 0 8px; font-size: 17px; }
  article p, article div { margin: 0 0 10px; }
  article p:last-child, article div:last-child { margin-bottom: 0; }
  article code {
    font: 12.5px ui-monospace, Menlo, monospace;
    background: var(--bg); padding: 1px 5px; border-radius: 4px;
  }
  article pre {
    min-height: 0; margin: 8px 0; padding: 10px 12px; font-size: 12.5px;
    background: var(--bg);
  }
  .goal { padding: 9px 12px; border-left: 3px solid var(--accent); background: var(--bg); }
  #hint { color: var(--dim); }
  #donebox {
    padding: 11px 13px; border-radius: 6px;
    border: 1px solid var(--green); background: var(--bg);
  }
  #donebox b.head { color: var(--green); display: block; margin-bottom: 5px; }
  footer {
    padding: 14px 20px 30px; color: var(--dim); font-size: 13px;
    border-top: 1px solid var(--line);
  }
  a { color: var(--accent); }
</style>

<header>
  <h1>Loophole <span>— 把精靈的漏洞編譯出來</span></h1>
  <p>
    十一關，每一關讓你自己找出一個漏洞。全部跑在你的瀏覽器裡，沒有伺服器。
  </p>
</header>

<nav id="steps" aria-label="關卡"></nav>

<main>
  <section id="teach">
    <div class="bar">
      <h2 id="lesson-act"></h2>
      <span class="grow"></span>
      <button id="prev">←</button>
      <button id="next">→</button>
    </div>
    <article id="lesson">
      <h3 id="lesson-title"></h3>
      <div id="lesson-brief"></div>
      <p class="goal"><b>目標：</b><span id="lesson-goal"></span></p>
      <p><button id="hintbtn">看提示</button> <span id="hint" hidden></span></p>
      <div id="donebox" hidden></div>
    </article>
  </section>

  <section>
    <div class="bar">
      <h2>wish</h2>
      <span class="grow"></span>
      <button class="run" id="run">Run</button>
      <button id="hunt" title="窮舉界限內每一支願望程式，找出所有合規卻拆穿的">Hunt</button>
      <button id="cancel" hidden>取消</button>
    </div>
    <textarea id="wish" spellcheck="false" aria-label="wish source"></textarea>
  </section>

  <section>
    <div class="bar">
      <h2>genie</h2>
      <span class="grow"></span>
      <button id="reset">還原這一關</button>
    </div>
    <textarea id="genie" spellcheck="false" aria-label="genie policy"></textarea>
  </section>

  <section style="grid-column: 1 / -1">
    <div class="bar">
      <h2>report</h2>
      <span id="verdict"></span>
    </div>
    <pre id="out">載入編譯器…</pre>
  </section>
</main>

<footer>
  <span id="ver"></span> ·
  <a href="https://github.com/rayhuang2006/Loophole">原始碼</a> ·
  <a href="https://github.com/rayhuang2006/Loophole/blob/main/docs/guide/tutorial.md">教學</a>
</footer>

<script src="./lessons.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const out = $('out'), verdict = $('verdict');

  // Escape codes come back from the compiler because the page asks for colour:
  // the diagnostics were designed with it, and it is the same renderer the
  // terminal uses. Only the four sequences the compiler emits are handled --
  // this is not a general ANSI terminal.
  const CLASSES = {
    '1;31': 'ansi-red', '1;36': 'ansi-cyan', '1;32': 'ansi-green', '1': 'ansi-bold'
  };
  function render(text) {
    let html = '', open = 0, i = 0;
    const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const re = /\x1b\[([0-9;]*)m/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      html += esc(text.slice(i, m.index));
      if (m[1] === '0' || m[1] === '') { while (open--) html += '</span>'; open = 0; }
      else if (CLASSES[m[1]]) { html += `<span class="${CLASSES[m[1]]}">`; open++; }
      i = m.index + m[0].length;
    }
    html += esc(text.slice(i));
    while (open-- > 0) html += '</span>';
    return html;
  }

  // The compiler is instantiated once, inside the worker. The page asks it for
  // the built-in genie and the version strings rather than loading a second
  // 450 KB copy of the module here just to read two constants.
  let worker = null, pending = 0, timer = null, booted = false, builtinGenie = '';

  function spawn() {
    // Never cache the worker. It is a kilobyte, and a stale one paired with a
    // newer page is a bug that reads as a logic error rather than a caching one:
    // the page asks for a field the old worker does not send, so every lesson
    // silently reports "not solved". The 370 KB module it loads is a different
    // URL and stays cached normally.
    worker = new Worker('./worker.js?v=' + Date.now());
    worker.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'ready') {
        const [c, w, g] = d.versions.split('|');
        $('ver').textContent = `loophole ${c} (wish ${w}, genie ${g})`;
        if (!booted) {
          builtinGenie = d.genie;
          booted = true;
          load(0);
        }
        return;
      }
      if (d.id !== pending) return;    // a stale reply from before a cancel
      finish(d);
    };
    worker.onerror = () => {
      out.textContent = '編譯器載不起來。這個頁面需要 WebAssembly 和 Web Worker。';
    };
  }
  spawn();

  function busy(on, what) {
    $('run').disabled = $('hunt').disabled = on;
    $('cancel').hidden = !on;
    if (timer) { clearInterval(timer); timer = null; }
    if (on) {
      const t0 = Date.now();
      out.textContent = what + '…';
      timer = setInterval(() => {
        out.textContent = what + '… ' + ((Date.now() - t0) / 1000).toFixed(1) + 's';
      }, 100);
    }
  }

  function finish(d) {
    busy(false);
    if (d.error) { out.textContent = '編譯器爆炸了（這是 bug，請回報）：' + d.error; return; }
    out.innerHTML = render(d.output) || '(沒有輸出)';
    const label = { 0: '沒有 exploit', 1: '有 exploit', 2: '讀不懂' }[d.code];
    verdict.className = 'verdict v' + d.code;
    verdict.textContent = `exit ${d.code} — ${label}`;
    mark(d);
  }

  // ---- lessons ------------------------------------------------------
  //
  // Progress is per-lesson and kept in localStorage, so closing the tab does
  // not throw away an hour. The lesson TEXT is never stored: it is content and
  // it changes, and a reader returning to a rewritten lesson should get the new
  // one, not a stale copy of the old.
  // Lesson text is written the way it reads in the source: blank lines between
  // paragraphs, `**bold**` where a term is being named. Everything else -- <b>,
  // <code>, <pre> -- is written as HTML, because the text is content this repo
  // controls, not something a reader supplies.
  function para(text) {
    return text.trim().split(/\n\s*\n/).map(t => {
      const body = t.trim().replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      return body.startsWith('<pre') ? body : '<p>' + body + '</p>';
    }).join('');
  }

  const KEY = 'loophole.solved.v1';
  let solved = new Set();
  try { solved = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...solved])); } catch (_) {} };

  let at = 0;
  const L = () => LESSONS[at];

  function drawSteps() {
    const nav = $('steps');
    nav.textContent = '';
    LESSONS.forEach((l, i) => {
      const b = document.createElement('button');
      b.textContent = (i + 1) + (solved.has(l.id) ? ' ✓' : '');
      b.title = l.title;
      b.className = (i === at ? 'on ' : '') + (solved.has(l.id) ? 'solved' : '');
      b.onclick = () => load(i);
      nav.appendChild(b);
    });
  }

  function load(i, keepEdits) {
    at = Math.max(0, Math.min(LESSONS.length - 1, i));
    const l = L();
    $('lesson-act').textContent = l.act;
    $('lesson-title').textContent = (at + 1) + '. ' + l.title;
    // The lesson text is written with a blank line between paragraphs, the way
    // it reads in the source. Turn those into paragraphs rather than making the
    // author write tags for something that is just a line break.
    $('lesson-brief').innerHTML = para(l.brief);
    $('lesson-goal').innerHTML = l.goal;
    $('hintbtn').hidden = !l.hint;
    $('hint').hidden = true;
    $('hint').innerHTML = l.hint || '';
    if (!keepEdits) {
      $('wish').value = l.wish;
      $('genie').value = l.genie === null || l.genie === undefined ? builtinGenie : l.genie;
    }
    $('prev').disabled = at === 0;
    $('next').disabled = at === LESSONS.length - 1;
    showDone(solved.has(l.id));
    out.textContent = l.huntOnly ? '按 Hunt。' : '按 Run。';
    verdict.textContent = '';
    drawSteps();
  }

  function showDone(on) {
    const box = $('donebox');
    box.hidden = !on;
    if (!on) return;
    box.innerHTML = '<b class="head">過關</b>' +
      para(L().done);
  }

  // The compiler is the marker. Nothing here looks at what you typed -- it asks
  // the genie whether you got away with it, which is the only question the
  // language has ever been about.
  function mark(d) {
    const l = L();
    let ok = false;
    if (l.huntOnly) ok = true;                    // pressing Hunt is the goal
    else if (d.json) { try { ok = l.pass(JSON.parse(d.json)); } catch (_) {} }
    if (ok && !solved.has(l.id)) { solved.add(l.id); save(); drawSteps(); }
    showDone(ok || solved.has(l.id));
  }

  $('prev').onclick = () => load(at - 1);
  $('next').onclick = () => load(at + 1);
  $('hintbtn').onclick = () => { $('hint').hidden = !$('hint').hidden; };
  $('reset').onclick = () => load(at);

  function go(hunt) {
    if (!booted) return;
    verdict.textContent = '';
    busy(true, hunt ? '搜尋界限內每一支程式' : '判決中');
    worker.postMessage({ id: ++pending, wish: $('wish').value,
                         genie: $('genie').value, hunt,
                         maxStmts: 2, maxWishes: 4 });
  }

  $('cancel').onclick = () => {
    // A search cannot be asked to stop politely — it is one long call inside
    // wasm with no yield point. Killing the worker is the only way out, so a
    // fresh one is started for the next run.
    worker.terminate(); pending++; spawn(); busy(false);
    out.textContent = '已取消。';
    verdict.textContent = '';
  };
  $('run').onclick = () => go(false);
  $('hunt').onclick = () => go(true);
  $('cancel').onclick = () => {
    // A search cannot be asked to stop politely -- it is one long call inside
    // wasm. Killing the worker is the only way out, so a fresh one is started
    // for the next run.
    worker.terminate(); pending++; spawn(); busy(false);
    out.textContent = '已取消。';
    verdict.textContent = '';
  };

  // Cmd/Ctrl-Enter runs, the way every editor does it.
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); go(false); }
  });
})();
</script>
