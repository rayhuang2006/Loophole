name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror"

      - name: Regression suite
        # Golden prose report for every example, the hunter's semantic
        # fingerprints, and the exit-code / --json contract.
        #
        # On failure the diff is echoed AND raised as an annotation, so the
        # reason is visible without opening the raw log.
        run: |
          if make check > /tmp/check.out 2>&1; then
            cat /tmp/check.out
          else
            cat /tmp/check.out
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/check.out | awk '{printf "%s%%0A", $0}')
            echo "::error title=Regression suite failed::${msg:0:8000}"
            exit 1
          fi

      - name: Specification examples still hold
        # Appendix A and Appendix B of the language spec are normative: an
        # implementation is not conforming until both produce these verdicts.
        run: |
          set -e
          ./loophole examples/07_the_original.wish | grep -q 'breached I1+I2'
          ./loophole --genie genie/mortal.genie examples/08_eternal_sleep.wish \
            | grep -q 'Life(fooled)'
          echo "Appendix A and B verdicts hold."

  sanitizers:
    # The searcher walks millions of programs, so a latent out-of-bounds read
    # can sit in a branch that only some platforms happen to survive. One did:
    # expandProgram indexed the operation table with -1 for a promise, which
    # was harmless on macOS and a segfault on Linux. Bounds are kept small here
    # because ASan/UBSan cost roughly an order of magnitude in speed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        run: |
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
              -fno-sanitize-recover=all loophole.cpp -o loophole-san
      - name: Judge every example
        run: |
          set -e
          for f in examples/*.wish; do
            g=$(sed -n 's/^# genie: *//p' "$f" | head -1)
            ./loophole-san ${g:+--genie $g} "$f" > /dev/null || [ $? -eq 1 ]
          done
      - name: Search every world
        run: |
          set -e
          ./loophole-san --hunt examples/01_humble.wish --max-stmts 2 --max-wishes 3 >/dev/null || [ $? -eq 1 ]
          ./loophole-san --genie genie/mortal.genie  --hunt examples/08_eternal_sleep.wish --max-stmts 2 --max-wishes 2 >/dev/null || [ $? -eq 1 ]
          ./loophole-san --genie genie/vigil.genie   --hunt examples/04_nobody.wish        --max-stmts 2 --max-wishes 2 >/dev/null || [ $? -eq 1 ]
          ./loophole-san --genie genie/careful.genie --hunt examples/08_eternal_sleep.wish --max-stmts 2 --max-wishes 2 >/dev/null || [ $? -eq 1 ]
