name: Release

# Runs on a version tag and attaches built binaries to the GitHub release.
#
# The manual trigger exists because a tag is a one-shot event: if this workflow
# is broken, you cannot re-run it without burning another version number. Give
# `tag` an existing tag to build and publish for it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (blank = build only, publish nothing)'
        required: false
        default: ''

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            # Statically linked, so it does not depend on the glibc of whichever
            # runner image built it. The program opens no shared libraries.
            flags: -static
          - os: macos-latest
            target: macos-arm64
            flags: -mmacosx-version-min=11.0
          # No Intel macOS build. `macos-13` is the last Intel image and GitHub
          # is retiring it, while `publish` needs every build to succeed — so
          # keeping it would let a platform nobody here uses block a release.
          # Anyone on an Intel Mac has the command line tools already: `make`.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror ${{ matrix.flags }} loophole.cpp -o loophole

      - name: Smoke test the binary we are about to ship
        run: |
          # Never publish a binary nobody ran. The regression suite is the same
          # one CI gates on, so a binary that passes it judges every shipped
          # example exactly as the goldens say it should.
          ./loophole --version
          ./ci/check.sh

      - name: Check the binary is the one we built
        # The smoke test runs `make`, which would happily rebuild with default
        # flags if it decided the binary was stale — and then we would ship a
        # dynamically linked Linux binary that dies on any older glibc. Assert
        # the property directly rather than trusting timestamps.
        if: matrix.target == 'linux-x86_64'
        run: |
          file loophole
          file loophole | grep -q 'statically linked' \
            || { echo "::error::the Linux binary is not static"; exit 1; }

      - name: Package
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          name="loophole-${version#v}-${{ matrix.target }}"
          cp loophole "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"
          else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
          # A second copy under a name with no version in it. Without this, the
          # `releases/latest/download/<file>` URL — the only stable install line
          # there is — breaks on every release, because the filename it points at
          # stops existing. The versioned copy stays for checksums and archiving.
          mv loophole "loophole-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: loophole-*

  publish:
    needs: build
    # Only a tag produces a release. A bare manual run stops after `build`, so
    # the workflow can be tested without publishing anything.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - name: Build the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "${{ github.event.inputs.tag || github.ref_name }}" > notes.md <<'PY'
          import json, re, subprocess, sys, pathlib

          version = sys.argv[1].lstrip('v')
          text = pathlib.Path('CHANGELOG.md').read_text()

          # Every version section, in the order the changelog lists them.
          sections = re.findall(r'^## loophole (\S+)[^\n]*\n(.*?)(?=^## |\Z)',
                                text, re.S | re.M)

          # Which versions already have a release. A version can be developed
          # without being tagged -- five were, before 1.3.1 -- so notes that
          # quote only the section matching the tag would omit everything since
          # the last publish, including whichever change was the largest.
          def published():
              try:
                  out = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'],
                                       capture_output=True, text=True, check=True).stdout
                  return {r['tagName'].lstrip('v') for r in json.loads(out)}
              except Exception as e:
                  print('::warning::gh release list failed (%s); falling back to '
                        'git tags' % e, file=sys.stderr)
              try:
                  out = subprocess.run(['git', 'tag', '-l'],
                                       capture_output=True, text=True, check=True).stdout
                  return {t.lstrip('v') for t in out.split()}
              except Exception:
                  print('::warning::no release history available; the notes may '
                        'repeat old entries', file=sys.stderr)
                  return set()

          # The tag being cut is itself a tag by the time this runs -- the push
          # of it is what triggered the workflow -- so it has to come out, or the
          # scan would stop on its own version and produce nothing.
          released = published() - {version}

          picked, started = [], False
          for ver, chunk in sections:
              if ver == version:
                  started = True
              if not started:
                  continue      # numbered above the tag being cut
              if ver in released:
                  break         # published before; everything below is old
              picked.append((ver, chunk.strip()))

          if not picked:
              print('_No changelog entry for this version._')
          elif len(picked) == 1:
              print(picked[0][1])
          else:
              # Kept separate rather than merged: each was a real step, and
              # flattening them would hide that a fix and the thing it fixed
              # were different versions.
              print('This release covers %d versions of the compiler; only the '
                    'newest is tagged.\n' % len(picked))
              for ver, chunk in picked:
                  print('### %s\n\n%s\n' % (ver, chunk))

          print()
          print('### Install')
          print()
          print('```bash')
          print('curl -L -o loophole \\')
          print('  https://github.com/rayhuang2006/Loophole/releases/latest/'
                'download/loophole-macos-arm64')
          print('chmod +x loophole && sudo mv loophole /usr/local/bin/')
          print('```')
          print()
          print('Swap the filename for your platform. `curl` does not set the '
                'macOS quarantine flag, so the binary runs as downloaded; a '
                'browser download does set it, and needs '
                '`xattr -d com.apple.quarantine loophole` first.')
          print()
          print('Or build it yourself -- one file, no dependencies, any C++17 '
                'compiler: `make && sudo make install`.')
          PY
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$version" dist/* \
            --title "$version" \
            --notes-file notes.md \
            --verify-tag
